<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Smart Home Dashboard</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; padding: 20px; color: #333; }
        .grid { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px; }
        .device-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); min-width: 200px; border-left: 5px solid #007bff; transition: transform 0.2s; }
        .device-card:hover { transform: translateY(-5px); }
        .device-name { margin: 0 0 10px 0; font-size: 1.2em; color: #2c3e50; }
        .value { font-size: 2em; font-weight: bold; color: #007bff; margin: 10px 0; }
        .status { font-size: 0.9em; color: #27ae60; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Panel Smart Home (Live)</h1>
    <p>Odbieranie danych z czujników gRPC przez WebSockets...</p>

    <div id="devices" class="grid">
    </div>

    <script>
        const socket = io('http://localhost:8080');

        socket.on('connect', () => {
            console.log('Połączono z Centralą!');
        });

        socket.on('device-update', (data) => {
            const container = document.getElementById('devices');
            
            let card = document.getElementById(data.id);
            
            if (!card) {
                card = document.createElement('div');
                card.id = data.id;
                card.className = 'device-card';
                container.appendChild(card);
            }
            
            card.innerHTML = `
                <h3 class="device-name"> ${data.id}</h3>
                <div style="color: #666; font-size: 0.9em;">Typ: ${data.type}</div>
                <div class="value">${parseFloat(data.value).toFixed(1)} °C</div>
                <div class="status"> Online (gRPC)</div>
            `;
        });
    </script>

</body>
</html>
